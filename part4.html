<!doctype html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8" />
    <title>Making your first Phaser 3 Game - Part 4</title>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
    <style type="text/css">
        body {
            margin: 0;
        }
    </style>
</head>
<body>

<script type="text/javascript">

    var config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 300 },
                debug: false
            }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    var platforms;

    var game = new Phaser.Game(config);

    function preload ()
    {
       this.load.image('night', 'assets/nightsky.png');
        this.load.image('ground', 'assets/platform.png');
        this.load.image('star', 'assets/star.png');
        this.load.image('bomb', 'assets/bomb.png');
        this.load.image('lollpop','assets/lollpop.png')
        this.load.spritesheet('dude', 'assets/dude.png', { frameWidth: 32, frameHeight: 48 });
    }

    var platforms;

    function create ()
    {
        //the nightsky with the ground add /going to try add lollpops at differnt palces as well 
        this.add.image(400, 100, 'night');

        platforms = this.physics.add.staticGroup();
        //got to firgure out how get rid of the white space 
        platforms.create(230,500,'lollpop')
         platforms.create(434,300,'lollpop')
          platforms.create(230,165,'lollpop')
        platforms.create(400, 568, 'ground').setScale(2).refreshBody();
//i think am going make it a plateform for now becasue i want to jump on change later if doest go well into something esle 
        platforms.create(600, 400, 'ground');
        platforms.create(50, 250, 'ground');
        platforms.create(750, 220, 'ground');
    }

    function update ()
    {
    }

</script>

</body>
</html>
